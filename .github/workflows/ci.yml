name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merges made by dependabot-automerge.yml use GITHUB_TOKEN, and pushes made
  # with GITHUB_TOKEN don't trigger push workflows, so the push trigger above
  # misses them. The weekly run tests main itself on Sunday afternoon Eastern,
  # after the Sunday morning Dependabot run (.github/dependabot.yml), and is the
  # only scheduled run of the check-drift job (manual dispatch also runs it);
  # schedule runs only on the default branch.
  # timezone keeps it at 14:23 Eastern through daylight saving changes. The minute
  # is off the hour to avoid peak scheduler load.
  schedule:
    - cron: '23 14 * * 0'
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy --strict src/
      - name: License compliance
        run: uv run pip-licenses --fail-on="GNU General Public License" --partial-match --order=license --ignore-packages docutils

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra code-mode --python ${{ matrix.python-version }}
      - name: Unit and mocked tests
        run: uv run pytest --cov=src/sigma_mcp --cov-report=term-missing --cov-fail-under=100 -q

  contract:
    name: Tool contract and env gating
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      # Guards the tool, annotation and profile counts published in README, and checks
      # the safety gates: SIGMA_MCP_READONLY=1 keeps only readOnlyHint=True tools, and the
      # bulk-destructive tools stay listed but are refused without SIGMA_MCP_ALLOW_BULK_DESTRUCTIVE=1.
      - name: Assert tool counts and safety gating
        run: uv run python scripts/check_tool_contract.py

  openapi-drift:
    name: OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      # Fails the build if any client path is absent from Sigma's published
      # OpenAPI spec. This is the guard against the wrong-path class of bug.
      - name: Check client paths against Sigma spec
        run: uv run python scripts/check_openapi_drift.py

      - name: Verify tool contracts
        run: uv run python scripts/check_tool_contract.py

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Protocol conformance suite
        run: ./scripts/check_conformance.sh

  build:
    name: Build and package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Build
        run: uv run python -m build
      - name: Reject fallback and untagged versions
        run: uv run python scripts/check_version.py
      - name: Twine check
        run: uv run twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build Docker image
        run: docker build -t mcp-server-sigma:ci-${{ github.sha }} .
      - name: Verify entrypoint
        run: docker run --rm mcp-server-sigma:ci-${{ github.sha }} --help

      - name: Builder fails below the ca-certificates floor
        # Raising CA_CERTIFICATES_FLOOR above any real Debian version makes the installed
        # package older than the floor, whatever version the base image or trixie-security
        # ships, so this is deterministic. The build must fail at the builder's floor check,
        # with its message, and before the pip bootstrap step starts.
        run: |
          set +e
          docker build --target builder --progress=plain \
            --build-arg CA_CERTIFICATES_FLOOR=99991231 . > ca-floor.log 2>&1
          status=$?
          set -e
          cat ca-floor.log
          if [ "$status" -eq 0 ]; then
            echo "::error::builder built with a ca-certificates floor above the installed version"
            exit 1
          fi
          if ! grep -q "is older than the floor 99991231" ca-floor.log; then
            echo "::error::builder failed, but not at the ca-certificates floor check"
            exit 1
          fi
          if grep -q -- "--require-hashes" ca-floor.log; then
            echo "::error::the pip bootstrap step started before the ca-certificates floor check failed"
            exit 1
          fi
          echo "Builder stops at the ca-certificates floor check before any pip step"

  check-drift:
    # Scheduled and manual runs only; pushes and pull requests skip it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Only this job opens an issue when the check finds drift or fails.
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Run Drift Check
        id: drift-check
        run: |
          # We capture the output and write it to a file so we can include it in the issue if it fails
          # Capture the exit code explicitly: under the default `bash -e` a failing
          # command would end the step before DRIFT_STATUS is written.
          set +e
          uv run python scripts/check_openapi_drift.py > drift_results.txt 2>&1
          status=$?
          set -e
          echo "DRIFT_STATUS=${status}" >> "$GITHUB_ENV"

      - name: Create Issue on Failure
        if: env.DRIFT_STATUS != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let driftOutput = "No output captured.";
            try {
              driftOutput = fs.readFileSync('drift_results.txt', 'utf8');
            } catch (err) {
              console.error(err);
            }
            
            const status = process.env.DRIFT_STATUS;
            // Exit 1 is also an uncaught Python exception, so drift needs the script's own summary line.
            const drift = status === '1' && driftOutput.includes('❌ Drift detected');
            const issueTitle = drift
              ? "Sigma API drift: client calls endpoints missing from the spec"
              : `Sigma API drift monitor failed (exit ${status})`;
            const summary = drift
              ? "The OpenAPI drift scan found client endpoints that are not in the Sigma Computing REST specification (possibly wrong or removed paths)."
              : "The OpenAPI drift scan could not finish (spec fetch failure, or an error in the script or its environment), so there is no drift result.";
            const issueBody = [
              "### Sigma API Drift Monitor",
              "",
              summary,
              "",
              "#### Scan Output",
              "```text",
              driftOutput,
              "```",
              "",
              drift
                ? "Please inspect the output, then fix the `src/sigma_mcp/client.py` methods or add the endpoint to `scripts/drift_allowlist.txt`."
                : "Fix the failing step shown in the output, then re-run the workflow.",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ["bug", "dependencies", "forge-todo"]
            });
