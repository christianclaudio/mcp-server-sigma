name: Sigma API Drift Monitor

on:
  schedule:
    # Run every Sunday at 04:00 UTC (12:00 AM EDT)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab

permissions:
  issues: write
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Run Drift Check
        id: drift-check
        run: |
          # We capture the output and write it to a file so we can include it in the issue if it fails
          # Capture the exit code explicitly: under the default `bash -e` a failing
          # command would end the step before DRIFT_STATUS is written.
          set +e
          uv run python scripts/check_openapi_drift.py > drift_results.txt 2>&1
          status=$?
          set -e
          echo "DRIFT_STATUS=${status}" >> "$GITHUB_ENV"

      - name: Create Issue on Failure
        if: env.DRIFT_STATUS != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let driftOutput = "No output captured.";
            try {
              driftOutput = fs.readFileSync('drift_results.txt', 'utf8');
            } catch (err) {
              console.error(err);
            }
            
            const status = process.env.DRIFT_STATUS;
            const drift = status === '1';
            const issueTitle = drift
              ? "Sigma API drift: client calls endpoints missing from the spec"
              : `Sigma API drift monitor failed (exit ${status})`;
            const summary = drift
              ? "The scheduled weekly OpenAPI drift scan found client endpoints that are not in the Sigma Computing REST specification (possibly wrong or removed paths)."
              : "The scheduled weekly OpenAPI drift scan could not finish (spec fetch or script error), so there is no drift result.";
            const issueBody = [
              "### Sigma API Drift Monitor",
              "",
              summary,
              "",
              "#### Scan Output",
              "```text",
              driftOutput,
              "```",
              "",
              drift
                ? "Please inspect the output, then fix the `src/sigma_mcp/client.py` methods or add the endpoint to `scripts/drift_allowlist.txt`."
                : "Fix the failing step shown in the output, then re-run the workflow.",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ["bug", "dependencies", "forge-todo"]
            });
