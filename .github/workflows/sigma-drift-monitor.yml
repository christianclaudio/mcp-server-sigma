name: Sigma API Drift Monitor

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab

permissions:
  issues: write
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Drift Check
        id: drift-check
        run: |
          # We capture the output and write it to a file so we can include it in the issue if it fails
          python scripts/check_openapi_drift.py > drift_results.txt 2>&1
          echo "DRIFT_STATUS=$?" >> $GITHUB_ENV
        continue-on-error: true

      - name: Create Issue on Failure
        if: env.DRIFT_STATUS != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let driftOutput = "No output captured.";
            try {
              driftOutput = fs.readFileSync('drift_results.txt', 'utf8');
            } catch (err) {
              console.error(err);
            }
            
            const issueTitle = "⚠️ Alert: Sigma API Drift Detected";
            const issueBody = `### Sigma API Drift Monitor Alert
            
            The scheduled weekly OpenAPI drift scan detected mismatching, deleted, or new endpoints in the Sigma Computing REST specification.
            
            #### Scan Output:
            \`\`\`text
            ${driftOutput}
            \`\`\`
            
            Please inspect the changes, update the \`client.py\` methods or the \`drift_allowlist.txt\` file, and release an update.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ["bug", "dependencies"]
            });
