[project]
name = "mcp-server-sigma"
version = "1.0.5"
description = "Enterprise Model Context Protocol (MCP) server for Sigma Computing — provision dashboards, construct data models, and automate cloud analytics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Christian Claudio", email = "christian.claudio@trulieve.com"},
]
keywords = ["sigma", "computing", "mcp", "model-context-protocol", "analytics", "bi", "mcp-server-sigma"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.11.0",
    "pyyaml>=6.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
mcp-server-sigma = "sigma_mcp.server:main"
sigma-mcp = "sigma_mcp.server:main"

[project.urls]
Homepage = "https://github.com/christianclaudio/mcp-server-sigma"
Repository = "https://github.com/christianclaudio/mcp-server-sigma"
Issues = "https://github.com/christianclaudio/mcp-server-sigma/issues"
Documentation = "https://github.com/christianclaudio/mcp-server-sigma#readme"
Changelog = "https://github.com/christianclaudio/mcp-server-sigma/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma_mcp"]

[tool.mypy]
strict = true
packages = ["sigma_mcp"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test scripts favor readable inline output over strict line limits.
"tests/*" = ["E501"]
# server.py holds long tool descriptions and capability strings; splitting
# these literals would hurt readability without improving the code.
"src/sigma_mcp/server.py" = ["E501"]
